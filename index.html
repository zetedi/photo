    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        // The hero photo is the home page's largest paint: start fetching it before the app boots.
        if (location.pathname === '/') {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.type = 'image/webp';
          link.setAttribute('imagesrcset', '/images/bg-640.webp 640w, /images/bg-1024.webp 1024w, /images/bg-1600.webp 1600w, /images/bg-2048.webp 2048w, /images/bg-2880.webp 2880w, /images/bg-4132.webp 4132w');
          link.setAttribute('imagesizes', '(min-width: 1024px) 58vw, 100vw');
          link.setAttribute('fetchpriority', 'high');
          document.head.appendChild(link);
        }

        // Resolve the theme before first paint so night mode never flashes white.
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (e) {}
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0f0e0c' : '#f3f0ea';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;font-family:Georgia,serif">The Divine Story — photography by Zoltan Etedi. Please enable JavaScript to view the gallery.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
