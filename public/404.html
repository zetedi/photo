<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Page not found — The Divine Story</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { --paper: #f3f0ea; --ink: #171614; --ink-3: #87827a; --line: rgb(23 22 20 / 0.13); }
      @media (prefers-color-scheme: dark) {
        :root { --paper: #0f0e0c; --ink: #ece7dd; --ink-3: #7a7469; --line: rgb(236 231 221 / 0.12); }
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: grid; place-content: center; gap: 2rem; padding: 2rem;
        background: var(--paper); color: var(--ink); text-align: center;
        font-family: 'Cormorant Garamond', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
        -webkit-font-smoothing: antialiased;
      }
      .eyebrow { font: 500 0.6875rem/1.4 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); }
      h1 { font-weight: 300; font-size: clamp(3rem, 9vw, 6.5rem); line-height: 0.95; letter-spacing: -0.015em; }
      em { font-style: italic; }
      a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; transition: border-color .4s; }
      a:hover { border-color: var(--ink); }
    </style>
  </head>
  <body>
    <p class="eyebrow">404 — Page not found</p>
    <h1>Out of <em>frame</em>.</h1>
    <p class="eyebrow"><a href="/">Return to The Divine Story</a></p>
  </body>
</html>
